# Casa·Orquesta · Voice — orchestrator service (Fly.io)
#
# Stage deployment. Founder runs `fly launch --copy-config --no-deploy` once,
# then `fly deploy` after each verified release.
#
# Region: ord (us-east). Mexico region pending; revisit when Fly publishes mx-cdmx.
# Secrets are set via `fly secrets set` — never committed.

app = "casa-orquesta-orchestrator"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "../../services/orchestrator/Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  ANTHROPIC_MODEL_ORCHESTRATOR = "accounts/fireworks/models/minimax-m3"
  ANTHROPIC_MODEL_DIALOG = "accounts/fireworks/models/deepseek-v4-flash-0731"
  ANTHROPIC_BASE_URL = "https://api.fireworks.ai/inference"
  LISTINGS_URL = "http://casa-orquesta-listings.internal:8000"
  MATCHING_URL = "http://casa-orquesta-matching.internal:8000"
  SCHEDULING_URL = "http://casa-orquesta-scheduling.internal:8000"
  DOCUMENTS_URL = "http://casa-orquesta-documents.internal:8000"
  PAYMENTS_URL = "http://casa-orquesta-payments.internal:8000"
  COMMS_URL = "http://casa-orquesta-comms.internal:8000"
  IDENTITY_URL = "http://casa-orquesta-identity.internal:8000"
  LANGFUSE_HOST = "http://casa-orquesta-langfuse.internal:3000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[deploy]
  strategy = "rolling"
