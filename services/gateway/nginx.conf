server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 200 "Casa Orquesta Voice gateway\n";
        add_header Content-Type text/plain;
    }

    location /voice/ {
        set $voice_gateway_upstream voice-gateway:8000;
        proxy_pass http://$voice_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/orchestrator/ {
        set $orchestrator_upstream orchestrator:8000;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass http://$orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/listings/ {
        set $listings_upstream listings:8000;
        rewrite ^/api/listings/(.*)$ /$1 break;
        proxy_pass http://$listings_upstream;
    }

    location /api/matching/ {
        set $matching_upstream matching:8000;
        rewrite ^/api/matching/(.*)$ /$1 break;
        proxy_pass http://$matching_upstream;
    }

    location /api/scheduling/ {
        set $scheduling_upstream scheduling:8000;
        rewrite ^/api/scheduling/(.*)$ /$1 break;
        proxy_pass http://$scheduling_upstream;
    }

    location /api/routing/ {
        set $routing_upstream routing:8000;
        rewrite ^/api/routing/(.*)$ /$1 break;
        proxy_pass http://$routing_upstream;
    }

    location /api/documents/ {
        set $documents_upstream documents:8000;
        rewrite ^/api/documents/(.*)$ /$1 break;
        proxy_pass http://$documents_upstream;
    }

    location /api/payments/ {
        set $payments_upstream payments:8000;
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass http://$payments_upstream;
    }

    location /api/comms/ {
        set $comms_upstream comms:8000;
        rewrite ^/api/comms/(.*)$ /$1 break;
        proxy_pass http://$comms_upstream;
    }

    location /api/identity/ {
        set $identity_upstream identity:8000;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass http://$identity_upstream;
    }
}
