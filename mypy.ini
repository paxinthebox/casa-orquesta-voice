# Casa·Orquesta · Voice — mypy configuration.
# Source modules are strictly checked; test files are excluded because
# they monkeypatch the `anthropic` module and reassign methods on live
# objects (stub-injection pattern) — constructs mypy cannot type.

[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = (?x)(
    /tests/
  )
